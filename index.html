<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5ede0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Иврит · Местоимения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew&display=swap">
<script>
(function(){var t=null;try{t=localStorage.getItem('hebrew_theme_v1');}catch(e){}if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="title-row">
    <div class="title" id="app-title" data-i18n="appTitle">Иврит · Местоимения</div>
    <div class="header-tools">
      <button class="tool-btn" id="btn-theme" type="button" aria-label="Тема">🌙</button>
      <button class="tool-btn" id="btn-keyboard" type="button" aria-label="Клавиатура">⌨️</button>
      <button class="tool-btn" id="btn-settings" type="button" aria-label="Настройки">⚙️</button>
      <div class="lang-switch" id="lang-switch" role="group" aria-label="Language / Язык">
        <button class="flag-btn" type="button" data-lang="ru" title="Русский" aria-label="Русский"><span aria-hidden="true">🇷🇺</span></button>
        <button class="flag-btn" type="button" data-lang="en" title="English" aria-label="English"><span aria-hidden="true">🇺🇸</span></button>
      </div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="map" data-i18n="tabMap">Карта</div>
    <div class="tab" data-tab="path" data-i18n="tabPath">Путь</div>
    <div class="tab" data-tab="train" data-i18n="tabTrain">Тренировка</div>
    <div class="tab" data-tab="phrases" data-i18n="tabPhrases">Фразы</div>
    <div class="tab" data-tab="prefix" data-i18n="tabPrefix">Приставки</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-text" id="progress-text">0 / 110</div>
    <div class="auto-badge" id="auto-badge" title="В автомате">⚡ 0</div>
  </div>
</header>

<main id="screen-map" class="screen active">
  <div class="subtabs" id="map-subtabs">
    <div class="subtab active" data-sub="roles" data-i18n="mapSubRoles">Роли</div>
    <div class="subtab" data-sub="key" data-i18n="mapSubKey">Ключ</div>
    <div class="subtab" data-sub="preps" data-i18n="mapSubPreps">Предлоги</div>
    <div class="subtab" data-sub="heat" data-i18n="mapSubHeat">Тепловая карта</div>
    <div class="subtab" data-sub="traps" data-i18n="mapSubTraps">Ловушки</div>
  </div>
  <div id="map-body"></div>
</main>

<main id="screen-path" class="screen"></main>
<main id="screen-train" class="screen"></main>
<main id="screen-phrases" class="screen"></main>
<main id="screen-prefix" class="screen"></main>

<div class="keyboard" id="keyboard" aria-hidden="true">
  <div class="keyboard-head">
    <span class="keyboard-title" data-i18n="keyboardTitle">Клавиатура</span>
    <button class="keyboard-close" id="btn-keyboard-close" type="button" aria-label="Скрыть клавиатуру">✕</button>
  </div>
  <div class="keyboard-grid" id="keyboard-grid" dir="rtl"></div>
  <div class="keyboard-nikud" id="keyboard-nikud" dir="rtl"></div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal">
  <div class="modal-card" id="modal-card">
    <button class="modal-close" id="modal-close" type="button" aria-label="Закрыть">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/map.js"></script>
<script src="js/train.js"></script>
<script src="js/phrases.js"></script>
<script src="js/prefixes.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
