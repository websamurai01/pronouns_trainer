<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5ede0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Иврит · Местоимения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew&display=swap">
<script>
(function(){var t=null;try{t=localStorage.getItem('hebrew_theme_v1');}catch(e){}if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  color-scheme:light;
  --bg:#f5ede0;--bg2:#efe4d2;--bg-glow:#fff6e8;--header-bg:rgba(245,237,224,.92);
  --card:#fffaf3;--card2:#faf3e7;--input-bg:#fffdf8;--input-focus:#fff;--track:#eadfcd;
  --ok-bg:#f8fbf2;--bad-bg:#fdf3f0;--accent:#c8654d;--accent-btn:#c8654d;--accent-grad:#e08a5e;
  --accent2:#2d7d8c;--olive:#6b8e4e;--gold:#d19b3f;--danger:#b3412e;--text:#3d3528;
  --muted:#8a7d68;--faint:#b3a48a;--border:#e2d4bd;--toast-bg:#3d3528;--toast-text:#fff;
  --shadow:0 8px 28px rgba(150,110,60,.14);--shadow-soft:0 4px 14px rgba(150,110,60,.07);
  --overlay:rgba(60,45,30,.55);
  --hebrew:"Noto Serif Hebrew","Frank Ruhl Libre","David Libre","Noto Sans Hebrew","Times New Roman",serif;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16120f;--bg2:#1d1813;--bg-glow:#2a2119;--header-bg:rgba(22,18,15,.92);
  --card:#241e18;--card2:#2d251d;--input-bg:#1b1611;--input-focus:#292219;--track:#3b2f24;
  --ok-bg:#1f2a1a;--bad-bg:#2c1c17;--accent:#e08a6a;--accent-btn:#b15c43;--accent-grad:#cf7354;
  --accent2:#6fb8c2;--olive:#9cbf72;--gold:#e3b768;--danger:#e0755e;--text:#efe4d3;
  --muted:#a99a84;--faint:#7f7260;--border:#483b2d;--toast-bg:#efe4d3;--toast-text:#1a1510;
  --shadow:0 8px 28px rgba(0,0,0,.45);--shadow-soft:0 4px 14px rgba(0,0,0,.3);
  --overlay:rgba(0,0,0,.65);
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Roboto",sans-serif;min-height:100vh;min-height:100dvh;overscroll-behavior:none;-webkit-text-size-adjust:100%;}
body{display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:radial-gradient(120% 60% at 50% 0%,var(--bg-glow) 0%,var(--bg) 55%,var(--bg2) 100%);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
.he{font-family:var(--hebrew);direction:rtl;unicode-bidi:isolate;}
.role-1{color:var(--accent);}
.role-2{color:var(--accent2);}
.role-3{color:var(--olive);}
header{position:sticky;top:0;z-index:10;background:var(--header-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:10px 12px 9px;}
.title-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.title{flex:1;min-width:0;font-size:17px;font-weight:800;color:var(--accent);letter-spacing:.2px;line-height:1.15;}
.header-tools{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.tool-btn{width:40px;height:44px;padding:0;border:1px solid var(--border);border-radius:9px;background:var(--card2);color:var(--text);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.tool-btn:active{transform:scale(.94);}
.tool-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(200,101,77,.1);}
.lang-switch{display:flex;gap:3px;flex-shrink:0;}
.flag-btn{width:40px;height:44px;padding:0;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;opacity:.42;transition:opacity .2s,box-shadow .2s,transform .15s;flex-shrink:0;}
.flag-btn:active{transform:scale(.94);}
.flag-btn.active{opacity:1;border-color:var(--accent);box-shadow:0 0 0 2px rgba(200,101,77,.2);}
.flag-btn span{pointer-events:none;}
.tabs{display:flex;gap:4px;background:var(--card2);padding:4px;border-radius:14px;margin-bottom:9px;border:1px solid var(--border);}
.tab{flex:1;text-align:center;padding:8px 2px;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .25s;min-height:44px;display:flex;align-items:center;justify-content:center;user-select:none;}
.tab.active{background:linear-gradient(135deg,var(--accent-btn),var(--accent-grad));color:#fff;box-shadow:0 4px 14px rgba(200,101,77,.3);}
.progress-wrap{display:flex;align-items:center;gap:8px;}
.progress-bar{flex:1;height:9px;background:var(--card2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--olive),var(--accent2));width:0%;transition:width .5s cubic-bezier(.22,1,.36,1);border-radius:8px;}
.progress-text{font-size:11px;color:var(--muted);font-weight:800;white-space:nowrap;}
.auto-badge{font-size:11px;font-weight:800;color:var(--gold);white-space:nowrap;background:var(--card2);border:1px solid var(--border);border-radius:999px;padding:3px 8px;}
main{flex:1;padding:14px 12px 26px;display:none;flex-direction:column;min-width:0;}
main.active{display:flex;}
.subtabs{display:flex;gap:4px;background:var(--card2);padding:4px;border-radius:12px;margin-bottom:14px;border:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.subtabs::-webkit-scrollbar{display:none;}
.subtab{flex:1 0 auto;text-align:center;padding:8px 9px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .25s;min-height:44px;display:flex;align-items:center;justify-content:center;user-select:none;white-space:nowrap;}
.subtab.active{background:rgba(200,101,77,.1);color:var(--accent);}
.section-title{font-size:16px;font-weight:800;margin:2px 0 4px;color:var(--text);}
.section-intro{font-size:12.5px;line-height:1.5;color:var(--muted);margin-bottom:14px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px 15px;box-shadow:var(--shadow-soft);}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.role-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:var(--shadow-soft);}
.role-icon{line-height:0;margin-bottom:4px;}
.role-pron{font-size:27px;font-weight:700;line-height:1.35;padding-top:4px;}
.role-translit{font-size:13px;font-weight:800;color:var(--accent);margin-top:1px;}
.role-label{font-size:12px;font-weight:700;color:var(--muted);margin-top:2px;}
.speak-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;min-width:44px;min-height:44px;padding:4px 8px;font-size:15px;cursor:pointer;margin-top:6px;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s,border-color .2s;}
.speak-btn:active{transform:scale(.92);}
.key-table{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.key-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:8px 12px;}
.key-role{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;min-width:0;}
.key-end{font-size:24px;font-weight:700;line-height:1.3;}
.rule-card{background:var(--card2);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.55;}
.rule-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);margin-bottom:4px;}
.families{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.family-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 11px;}
.family-title{font-size:11px;font-weight:800;color:var(--accent2);margin-bottom:5px;}
.family-list{font-size:18px;font-weight:700;line-height:1.5;}
.example-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--card);}
.example-table{border-collapse:collapse;width:100%;min-width:420px;}
.example-table th,.example-table td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:center;font-size:12px;}
.example-table th{background:var(--card2);font-weight:800;color:var(--muted);}
.example-table td.he{font-size:18px;font-weight:700;}
.prep-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow-soft);}
.prep-head{display:flex;align-items:center;gap:11px;margin-bottom:10px;}
.prep-icon{line-height:0;flex-shrink:0;color:var(--accent);}
.prep-name{font-size:28px;font-weight:800;line-height:1.2;}
.prep-meaning{font-size:12.5px;line-height:1.45;color:var(--text);}
.prep-family{font-size:10.5px;font-weight:800;color:var(--accent2);margin-top:3px;text-transform:uppercase;letter-spacing:.4px;}
.form-table{display:flex;flex-direction:column;gap:2px;}
.form-row{display:grid;grid-template-columns:66px 1fr auto;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed var(--border);}
.form-row:last-child{border-bottom:none;}
.form-role{font-size:11px;font-weight:700;color:var(--muted);line-height:1.2;}
.form-he{font-size:22px;font-weight:700;line-height:1.4;text-align:right;}
.form-translit{font-size:11.5px;color:var(--muted);font-weight:700;}
.form-gloss{font-size:11px;color:var(--faint);grid-column:2 / 3;margin-top:-3px;}
.irreg-mark{display:inline-block;color:var(--gold);font-weight:900;margin-inline-start:2px;font-size:12px;}
.heat-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--card);}
.heat-table{border-collapse:separate;border-spacing:0;min-width:480px;width:100%;}
.heat-table th,.heat-table td{padding:0;text-align:center;}
.heat-table thead th{padding:6px 2px;background:var(--card2);border-bottom:1px solid var(--border);font-size:16px;}
.heat-role{background:var(--card2);padding:4px 6px !important;border-bottom:1px solid var(--border);border-inline-end:1px solid var(--border);}
.heat-role-inner{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;white-space:nowrap;}
.heat-cell{width:100%;min-width:44px;min-height:44px;border:none;border-bottom:1px solid var(--border);border-inline-end:1px solid var(--border);color:#fff;font-size:10px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px rgba(0,0,0,.35);}
html[data-theme="dark"] .heat-cell{color:#16120f;text-shadow:none;}
.heat-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:700;margin-top:10px;}
.legend-dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px;}
.trap-card{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--danger);border-radius:15px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow-soft);}
.trap-title{font-size:13px;font-weight:800;color:var(--danger);margin-bottom:4px;}
.trap-text{font-size:12.5px;line-height:1.55;}
.path-list{display:flex;flex-direction:column;gap:10px;}
.path-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:13px 14px;cursor:pointer;box-shadow:var(--shadow-soft);transition:transform .15s,border-color .2s;color:var(--text);}
.path-card:active{transform:scale(.985);}
.path-card.locked{opacity:.48;cursor:not-allowed;}
.ring{width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--olive) calc(var(--pct) * 1%),var(--track) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ring-inner{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:var(--text);}
.path-info{flex:1;min-width:0;}
.path-title{font-size:14px;font-weight:800;margin-bottom:2px;}
.path-desc{font-size:11.5px;line-height:1.4;color:var(--muted);}
.path-meta{font-size:10.5px;font-weight:800;color:var(--accent2);margin-top:4px;}
.train-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.stat-pill{flex:1 1 auto;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:6px 10px;font-size:11px;font-weight:800;color:var(--muted);text-align:center;white-space:nowrap;}
.stat-pill b{color:var(--accent);}
.filter-wrap{margin-bottom:10px;}
.filter-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:6px;}
.filter-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);width:100%;}
.chip{background:var(--card2);border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;cursor:pointer;min-height:44px;transition:all .18s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;}
.chip:active{transform:scale(.95);}
.chip.active{border-color:var(--accent);color:var(--accent);background:rgba(200,101,77,.09);}
.chip .he{font-size:15px;font-weight:700;}
.mode-pills{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;}
.mode-pills::-webkit-scrollbar{display:none;}
.mode-pill{flex:0 0 auto;background:var(--card2);border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:8px 13px;font-size:11.5px;font-weight:800;cursor:pointer;min-height:44px;transition:all .2s;white-space:nowrap;}
.mode-pill.active{background:linear-gradient(135deg,var(--accent-btn),var(--accent-grad));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(200,101,77,.25);}
.train-card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:16px 14px;box-shadow:var(--shadow);animation:cardIn .35s cubic-bezier(.22,1,.36,1);}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
.prompt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.prompt-prep{display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;min-width:0;color:var(--accent);}
.prompt-prep .prep-svg{width:44px;height:44px;}
.prep-name{font-size:30px;font-weight:800;line-height:1.2;color:var(--text);}
.prompt-sub{font-size:10.5px;line-height:1.35;color:var(--muted);max-width:150px;}
.prompt-role{display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;min-width:0;}
.prompt-role .role-label{color:currentColor;font-size:12px;font-weight:800;}
.frame-box{font-size:clamp(22px,7vw,28px);font-weight:700;text-align:center;line-height:1.6;padding:10px 6px;margin-bottom:4px;}
.frame-gloss{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:10px;}
.frame-blank{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--accent);vertical-align:middle;margin:0 4px;}
.hint-box{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:12.5px;line-height:1.5;}
.hint-gloss{font-weight:800;color:var(--text);}
.hint-form{font-size:20px;font-weight:700;margin-top:3px;}
.hint-translit{font-size:12px;color:var(--muted);font-weight:700;}
.he-input{width:100%;text-align:center;font-family:var(--hebrew);font-size:30px;font-weight:700;padding:12px;background:var(--input-bg);border:2px solid var(--border);border-radius:14px;color:var(--text);direction:rtl;unicode-bidi:isolate;outline:none;transition:all .2s;caret-color:var(--accent);min-height:60px;}
.he-input::placeholder{color:var(--muted);opacity:.6;}
.he-input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(45,125,140,.2);background:var(--input-focus);}
.he-input.shake{animation:shake .4s;border-color:var(--danger);}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-5px);}40%{transform:translateX(5px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}
.action-row{display:flex;gap:8px;margin-top:10px;}
.btn-primary{flex:1;background:linear-gradient(135deg,var(--accent-btn),var(--accent-grad));color:#fff;border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;min-height:50px;transition:transform .15s;box-shadow:0 6px 18px rgba(200,101,77,.28);}
.btn-primary:active{transform:scale(.97);}
.btn-primary:disabled{opacity:.5;cursor:default;}
.btn-secondary{flex:1;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;min-height:50px;transition:transform .15s,border-color .2s;}
.btn-secondary:active{transform:scale(.97);}
.btn-secondary:hover{border-color:var(--accent);}
.btn-ghost{background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;padding:8px;min-height:44px;}
.result-box{margin-top:12px;border-radius:14px;padding:12px 14px;display:none;text-align:center;border:1px solid var(--border);}
.result-box.ok{display:block;background:var(--ok-bg);border-color:var(--olive);}
.result-box.bad{display:block;background:var(--bad-bg);border-color:var(--danger);}
.result-title{font-size:13px;font-weight:900;margin-bottom:4px;}
.result-box.ok .result-title{color:var(--olive);}
.result-box.bad .result-title{color:var(--danger);}
.result-he{font-size:30px;font-weight:700;line-height:1.45;}
.result-translit{font-size:14px;font-weight:800;color:var(--accent);}
.result-gloss{font-size:12px;color:var(--muted);}
.result-wrong-note{font-size:12px;color:var(--muted);margin-top:5px;}
.colloq-note{font-size:11.5px;color:var(--accent2);font-weight:700;margin-top:6px;}
.assembly{display:flex;align-items:center;justify-content:center;gap:2px;min-height:64px;background:var(--input-bg);border:2px dashed var(--border);border-radius:14px;margin-bottom:12px;font-family:var(--hebrew);direction:rtl;unicode-bidi:isolate;}
.asm-slot{font-size:34px;font-weight:700;min-width:32px;text-align:center;line-height:1.4;}
.asm-placeholder{color:var(--faint);font-size:22px;}
.asm-plus{color:var(--faint);font-size:18px;margin:0 2px;}
.build-section{margin-bottom:9px;}
.build-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);margin-bottom:5px;}
.build-row{display:flex;gap:6px;flex-wrap:wrap;}
.build-chip{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:12px;min-width:50px;min-height:46px;padding:6px 12px;font-family:var(--hebrew);font-size:24px;font-weight:700;cursor:pointer;transition:all .15s;direction:rtl;unicode-bidi:isolate;}
.build-chip:active{transform:scale(.95);}
.build-chip.active{border-color:var(--accent2);background:rgba(45,125,140,.1);box-shadow:0 0 0 2px rgba(45,125,140,.18);}
.whole-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.whole-option{background:var(--card2);border:1px solid var(--border);border-radius:14px;min-height:56px;padding:8px;font-family:var(--hebrew);font-size:26px;font-weight:700;cursor:pointer;transition:all .15s;direction:rtl;unicode-bidi:isolate;color:var(--text);}
.whole-option:active{transform:scale(.96);}
.whole-option.correct{border-color:var(--olive);background:var(--ok-bg);}
.whole-option.wrong{border-color:var(--danger);background:var(--bad-bg);}
.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px;}
.role-btn{display:flex;align-items:center;gap:7px;background:var(--card2);border:1.5px solid var(--border);border-radius:14px;padding:7px 9px;cursor:pointer;min-height:50px;transition:all .15s;text-align:left;color:var(--text);}
.role-btn:active{transform:scale(.97);}

<script>
const RU_LAT={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
function romanize(text){return Array.from(String(text).toLowerCase()).map(function(ch){return RU_LAT[ch]!==undefined?RU_LAT[ch]:ch;}).join('');}

function stripNikud(s){
  let out='';
  for(const ch of String(s)){
    const cp=ch.codePointAt(0);
    if(cp>=0x0591&&cp<=0x05C7) continue;
    out+=ch;
  }
  return out;
}

  if(art) return {ru:gRu+' (этот/эта) '+wordRu,en:gEn+' the '+wordEn};

function t(key,vars){
  const dict=I18N[currentLang]||I18N.ru;
  let out=dict[key]!==undefined?dict[key]:I18N.ru[key];
  if(out===undefined) out=key;
  if(vars){Object.keys(vars).forEach(function(k){out=out.split('{'+k+'}').join(String(vars[k]));});}
  return out;
}
function roleLabel(role){return currentLang==='en'?ROLE_LABEL_EN[role]:ROLE_LABEL_RU[role];}

    if(['colloquial','strict'].indexOf(merged.register)<0) merged.register='colloquial';
    if(typeof merged.endColors!=='boolean') merged.endColors=true;
    if(['auto','off','smart','full'].indexOf(merged.nikudCheck)<0) merged.nikudCheck='auto';
    if(!merged.pfxFilter||typeof merged.pfxFilter!=='object') merged.pfxFilter={prefixes:[],tags:[],forms:[],weak:false,notAuto:false};
    if(!Array.isArray(merged.pfxFilter.prefixes)) merged.pfxFilter.prefixes=[];
    if(!Array.isArray(merged.pfxFilter.tags)) merged.pfxFilter.tags=[];
    if(!Array.isArray(merged.pfxFilter.forms)) merged.pfxFilter.forms=[];
    if(typeof merged.pfxFilter.weak!=='boolean') merged.pfxFilter.weak=false;
    if(typeof merged.pfxFilter.notAuto!=='boolean') merged.pfxFilter.notAuto=false;
    return merged;
  }catch(e){return def;}
}

function N(s){
  if(s===null||s===undefined) return '';
  let out='';
  for(const ch of String(s)){
    const cp=ch.codePointAt(0);
    if(cp>=0x0591&&cp<=0x05C7) continue;
    out+=ch;
  }
  const map={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
  out=Array.from(out).map(function(c){return map[c]||c;}).join('');
  out=out.replace(/יי/g,'י');
  out=out.replace(/\s+/g,'');
  return out;
}

function formParts(prepId,role){
  const p=PREPS[prepId];
  const f=FORMS[prepId][role];
  if(p.irregularRoles.indexOf(role)>=0) return {stem:f.u,end:'',irregular:true};
  if(f.u.indexOf(p.stem)===0) return {stem:p.stem,end:f.u.slice(p.stem.length),irregular:false};
  return {stem:f.u,end:'',irregular:true};
}
function splitNikud(prepId,role){
  const p=PREPS[prepId];
  const f=FORMS[prepId][role];
  if(p.irregularRoles.indexOf(role)>=0) return {stemP:'',endP:f.p};
  const parts=formParts(prepId,role);
  if(!parts.end) return {stemP:'',endP:f.p};
  const idx=f.p.indexOf(parts.end.charAt(0));
  if(idx<0) return {stemP:'',endP:f.p};
  return {stemP:f.p.slice(0,idx),endP:f.p.slice(idx)};
}
function acceptedForms(prepId,role){
  const f=FORMS[prepId][role];
  let arr=[{u:f.u,p:f.p,pm:f.pm||null,label:roleLabel(role)}];
  if(prepId==='min'&&role==='1p') arr.push({u:'ממנו',p:FORMS['min']['3ms'].p,pm:null,label:roleLabel(role)});
  if(settings&&settings.register==='colloquial'){
    if(role==='2fp') arr=arr.concat(acceptedForms(prepId,'2mp'));
    if(role==='3fp') arr=arr.concat(acceptedForms(prepId,'3mp'));
  }
  return arr;
}
function acceptedNorm(prepId,role){
  const arr=[];
  acceptedForms(prepId,role).forEach(function(f){
    arr.push(N(f.u));
    if(f.p) arr.push(N(f.p));
    if(f.pm) arr.push(N(f.pm));
  });
  return arr;
}
function matchesRole(prepId,role,input){return acceptedNorm(prepId,role).indexOf(N(input))>=0;}
function matchingRoles(prepId,input){
  const n=N(input);
  return ROLE_IDS.filter(function(r){return acceptedNorm(prepId,r).indexOf(n)>=0;});
}
// Spelling only: acceptedForms() also folds 2fp/3fp onto the masculine form,
// which would make one pointed form match two roles. Do not use it here.
function matchingRolesExact(prepId,displayedP){

    return (f.p&&exact(T,parseClusters(f.p)))||(f.pm&&exact(T,parseClusters(f.pm)));
  });
}
function prepPoolForms(prepId,targetRole){

  if(prepId==='min'&&targetRole==='1p') exclude.add('3ms');

function effNikudCheck(){
  const v=(settings&&settings.nikudCheck)||'auto';
  if(v==='auto') return (settings&&settings.nikud==='always')?'smart':'off';
  return v;
}
function effectiveNikudMode(minMode){
  const eff=effNikudCheck();
  if(!minMode) return eff;
  const rank={off:0,smart:1,full:2};
  return (rank[minMode]||0)>rank[eff]?minMode:eff;
}
function parseClusters(s){
  if(!s) return [];
  const finalMap={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
  const arr=[];
  for(const ch of String(s)){
    const cp=ch.codePointAt(0);
    if(cp===0x20||cp===0x09||cp===0x0A||cp===0x0D) continue;
    if(cp>=0x0591&&cp<=0x05AF) continue;
    if(cp===0x05BD||cp===0x05BF||cp===0x05C1||cp===0x05C2) continue;
    if(cp===0x05BE||cp===0x05C0||(cp>=0x05C3&&cp<=0x05C6)) continue;
    if(cp>=0x05B0&&cp<=0x05BB){
      if(arr.length){
        let mark=cp;
        if(cp===0x05BA) mark=0x05B9;
        arr[arr.length-1].m.add(mark);
      }
      continue;
    }
    if(cp===0x05BC){
      if(arr.length&&arr[arr.length-1].c==='ו') arr[arr.length-1].m.add(0x05BC);
      continue;
    }
    if(cp===0x05C7){
      if(arr.length) arr[arr.length-1].m.add(0x05B8);
      continue;
    }
    if(cp>=0x05D0&&cp<=0x05EA){
      const base=finalMap[ch]||ch;
      arr.push({c:base,m:new Set()});
      continue;
    }
  }
  const out=[];
  for(let i=0;i<arr.length;i++){
    if(arr[i].c==='י'&&arr[i].m.size===0&&i+1<arr.length&&arr[i+1].c==='י'&&arr[i+1].m.size===0){
      out.push({c:'י',m:new Set()});i++;
    }else{
      out.push(arr[i]);
    }
  }
  return out;
}
function skeletonOf(clusters){return clusters.map(function(c){return c.c;}).join('');}
function setsEqual(a,b){
  if(a.size!==b.size) return false;
  let ok=true;
  a.forEach(function(x){if(!b.has(x))ok=false;});
  return ok;
}
function consistent(T,P){
  if(T.length!==P.length) return false;
  for(let i=0;i<T.length;i++){
    if(T[i].c!==P[i].c) return false;
    if(T[i].m.size>0&&!setsEqual(T[i].m,P[i].m)) return false;
  }
  return true;
}
function exact(T,P){
  if(T.length!==P.length) return false;
  for(let i=0;i<T.length;i++){
    if(T[i].c!==P[i].c) return false;
    if(!setsEqual(T[i].m,P[i].m)) return false;
  }
  return true;
}
function checkTyped(poolForms,accForms,input,minMode){
  const mode=effectiveNikudMode(minMode);
  if(mode==='off'){
    const n=N(input);
    const ok=accForms.some(function(f){return N(f.u)===n||(f.p&&N(f.p)===n)||(f.pm&&N(f.pm)===n);});
    return {status:ok?'correct':'wrong',reason:ok?'':'consonants',readings:[]};
  }
  const T=parseClusters(input);
  if(!T.length) return {status:'wrong',reason:'consonants',readings:[]};
  const skel=skeletonOf(T);
  const targetVariants=[];
  accForms.forEach(function(f){
    if(f.p) targetVariants.push({form:f,text:f.p,clusters:parseClusters(f.p)});
    if(f.pm) targetVariants.push({form:f,text:f.pm,clusters:parseClusters(f.pm)});
  });
  const matchingVariants=targetVariants.filter(function(v){return skeletonOf(v.clusters)===skel;});
  if(!matchingVariants.length) return {status:'wrong',reason:'consonants',readings:[]};
  const hasMarks=T.some(function(c){return c.m.size>0;});
  if(mode==='full'){
    if(!hasMarks) return {status:'wrong',reason:'needNikud',readings:[]};
    const ok=matchingVariants.some(function(v){return exact(T,v.clusters);});
    if(ok) return {status:'correct',reason:'',readings:[]};
    return {status:'wrong',reason:'nikud',readings:[]};
  }
  const targetOk=matchingVariants.some(function(v){return consistent(T,v.clusters);});
  if(!targetOk) return {status:'wrong',reason:hasMarks?'nikud':'consonants',readings:[]};
  const competitorMatches=[];
  (poolForms||[]).forEach(function(f){
    const variants=[];
    if(f.p) variants.push({text:f.p,clusters:parseClusters(f.p)});
    if(f.pm) variants.push({text:f.pm,clusters:parseClusters(f.pm)});
    const hit=variants.find(function(v){return skeletonOf(v.clusters)===skel&&consistent(T,v.clusters);});
    if(hit) competitorMatches.push({form:f,text:hit.text});
  });
  if(competitorMatches.length){
    const readings=[];
    matchingVariants.forEach(function(v){readings.push({text:v.text,label:v.form.label||''});});
    competitorMatches.forEach(function(c){readings.push({text:c.text,label:c.form.label||''});});
    return {status:'ambiguous',reason:'',readings:readings};
  }
  return {status:'correct',reason:'',readings:[]};
}

function getStat(key){
  if(!stats[key]) stats[key]={r:0,w:0,ms:0,fs:0,conf:{},last:0};
  return stats[key];
}
function statRate(key){
  const s=stats[key];
  if(!s) return null;
  const tot=s.r+s.w;
  return tot>0?Math.round(s.r/tot*100):null;
}
function isMastered(key){
  const s=stats[key];
  if(!s) return false;
  const tot=s.r+s.w;
  return tot>=3&&s.r/tot>=0.7;
}
function isAuto(key){const s=stats[key];return !!s&&s.fs>=3;}
function recordAnswer(key,correct,elapsed,given,mode){
  const s=getStat(key);
  const fastLimit=mode==='choice'?2500:7000;
  const fast=correct&&elapsed<=fastLimit;
  if(correct) s.r++; else s.w++;
  s.ms=s.ms?Math.round(s.ms*0.7+elapsed*0.3):Math.round(elapsed);
  if(fast) s.fs++; else s.fs=0;
  if(!correct&&given){const g=String(given).trim()||String(given);s.conf[g]=(s.conf[g]||0)+1;}
  s.last=Date.now();
  settings.score+=(correct?10:0)+(fast?5:0);
  if(correct){settings.streak++;if(settings.streak>settings.bestStreak)settings.bestStreak=settings.streak;}
  else settings.streak=0;
  saveStats();saveSettings();updateProgress();
  return {fast:fast,stat:s};
}
function progressKeys(){
  const keys=[];
  PREP_DATA.forEach(function(p){ROLE_IDS.forEach(function(r){keys.push(p.id+':'+r);});});
  ROLE_IDS.forEach(function(r){keys.push('pron:'+r);});
  return keys;
}
function updateProgress(){
  const keys=progressKeys();
  let done=0,auto=0;
  keys.forEach(function(k){if(isMastered(k))done++;if(isAuto(k))auto++;});
  const total=keys.length;
  const fill=document.getElementById('progress-fill');
  const text=document.getElementById('progress-text');
  const badge=document.getElementById('auto-badge');
  if(fill) fill.style.width=(done/total*100)+'%';
  if(text) text.textContent=done+' / '+total;
  if(badge){badge.textContent='⚡ '+auto;badge.title=t('auto')+': '+auto;}
}

function levelKeys(level){
  const keys=[];
  if(level.id===0){
    ROLE_IDS.forEach(function(r){keys.push('pron:'+r);keys.push('end:'+r);});
    return keys;
  }
  level.preps.forEach(function(pid){ROLE_IDS.forEach(function(r){keys.push(pid+':'+r);});});
  level.frames.forEach(function(fid){ROLE_IDS.forEach(function(r){keys.push('frame:'+fid+':'+r);});});
  return keys;
}
function levelProgress(level){
  const keys=levelKeys(level);
  let done=0;
  keys.forEach(function(k){if(isMastered(k))done++;});
  return {done:done,total:keys.length,pct:keys.length?Math.round(done/keys.length*100):0};
}
function levelUnlocked(index){
  if(!settings.strictPath) return true;
  if(index===0) return true;
  return levelProgress(LEVELS[index-1]).pct>=70;
}

function initTrainFilter(){
  trainFilter={preps:new Set(PREP_DATA.map(function(p){return p.id;})),frames:new Set(),persons:new Set([1,2,3]),nums:new Set(['s','p']),gens:new Set(['m','f']),weak:false,notAuto:false};
}
function roleAllowed(role){
  const m=ROLE_META[role];
  return trainFilter.persons.has(m.p)&&trainFilter.nums.has(m.n)&&trainFilter.gens.has(m.g);
}
function buildPool(){
  const pool=[];
  trainFilter.preps.forEach(function(pid){
    ROLE_IDS.forEach(function(role){
      if(!roleAllowed(role)) return;
      pool.push({type:'prep',prep:pid,role:role,key:pid+':'+role});
    });
  });
  trainFilter.frames.forEach(function(fid){
    const fr=FRAMES_BY_ID[fid];
    ROLE_IDS.forEach(function(role){
      if(!roleAllowed(role)) return;
      pool.push({type:'frame',frame:fid,prep:fr.prep,role:role,key:'frame:'+fid+':'+role});
    });
  });
  let out=pool;
  if(trainFilter.weak){
    out=out.filter(function(q){const s=stats[q.key];const rate=statRate(q.key);return !s||(s.r+s.w)<3||(rate!==null&&rate<70);});
  }
  if(trainFilter.notAuto){
    out=out.filter(function(q){return !isAuto(q.key);});
  }
  return out;
}
function weightFor(q){
  const rate=statRate(q.key);
  const acc=rate===null?1:1-rate/100;
  let w=1+3*acc;
  if(!isMastered(q.key)) w+=2;
  if(!isAuto(q.key)) w+=1;
  if(recentWrong.indexOf(q.key)>=0) w*=2;
  return w;
}
function weightedPick(pool){
  let total=0;
  pool.forEach(function(q){total+=weightFor(q);});
  let r=Math.random()*total;
  for(let i=0;i<pool.length;i++){
    r-=weightFor(pool[i]);
    if(r<=0) return pool[i];
  }
  return pool[pool.length-1];
}
function pickQuestion(pool){
  if(!pool||!pool.length) return null;
  let best=null;
  for(let attempt=0;attempt<6;attempt++){
    const cand=weightedPick(pool);
    const l1=history[history.length-1],l2=history[history.length-2];
    if(l1&&l2&&l1.prep===cand.prep&&l2.prep===cand.prep) continue;
    if(l1&&l2&&l1.role===cand.role&&l2.role===cand.role) continue;
    best=cand;break;
  }
  if(!best) best=weightedPick(pool);
  history.push(best);
  if(history.length>6) history.shift();
  return best;
}
function noteWrong(key){
  recentWrong.push(key);
  if(recentWrong.length>8) recentWrong.shift();

const ALL_STEMS=Array.from(new Set(PREP_DATA.map(function(p){return p.stem;})));
const ALL_ENDS=Array.from(new Set(PREP_DATA.reduce(function(acc,p){p.ends.forEach(function(e){if(e.charAt(0)!=='=')acc.push(e);});return acc;},[])));
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;}return arr;}
function makeStemOptions(correct){
  const opts=[correct];
  const pool=ALL_STEMS.filter(function(s){return s!==correct;});
  shuffle(pool);
  pool.forEach(function(s){if(opts.length<4&&opts.indexOf(s)<0)opts.push(s);});
  return shuffle(opts);
}
function makeEndOptions(correct){
  const conf=[];
  if(correct==='ך')conf.push('יך');
  if(correct==='יך')conf.push('ך');
  if(correct==='הם')conf.push('ם');
  if(correct==='ם')conf.push('הם');
  if(correct==='הן')conf.push('ן');
  if(correct==='ן')conf.push('הן');
  if(correct==='כם')conf.push('כן');
  if(correct==='כן')conf.push('כם');
  const opts=[correct];
  conf.forEach(function(c){if(c!==correct&&opts.indexOf(c)<0&&opts.length<4)opts.push(c);});
  const pool=ALL_ENDS.filter(function(e){return e!==correct;});
  shuffle(pool);
  pool.forEach(function(e){if(opts.length<4&&opts.indexOf(e)<0)opts.push(e);});
  return shuffle(opts);
}
function wholeFormOptions(q){
  const correct=FORMS[q.prep][q.role].u;
  const opts=[correct];
  const pool=[];
  PREP_DATA.forEach(function(p){ROLE_IDS.forEach(function(r){if(p.id===q.prep&&r===q.role)return;pool.push(FORMS[p.id][r].u);});});
  shuffle(pool);
  pool.forEach(function(u){if(opts.length<4&&!opts.some(function(o){return N(o)===N(u);}))opts.push(u);});
  return shuffle(opts);
}

function roleFromPerspective(speakerId,listenerId,targetId){
  const sp=PEOPLE[speakerId],li=PEOPLE[listenerId],ta=PEOPLE[targetId];
  if(targetId===speakerId) return sp.members.length>1?'1p':'1s';
  const spSet=new Set(sp.members),liSet=new Set(li.members),taSet=new Set(ta.members);
  const containsAll=function(a,b){return Array.from(b).every(function(x){return a.has(x);});};
  if(containsAll(taSet,spSet)) return '1p';
  if(targetId===listenerId) return li.g==='f'?'2fs':'2ms';
  if(containsAll(taSet,liSet)) return li.g==='f'?'2fp':'2mp';
  if(ta.members.length>1) return ta.members.some(function(m){return PEOPLE[m].g==='m';})?'3mp':'3fp';
  return ta.g==='f'?'3fs':'3ms';
}
function newPerspective(){
  const ids=Object.keys(PEOPLE);
  let s=ids[Math.floor(Math.random()*ids.length)];
  let l=ids[Math.floor(Math.random()*ids.length)];
  let guard=0;
  while(l===s&&guard<20){l=ids[Math.floor(Math.random()*ids.length)];guard++;}
  perspState={speaker:s,listener:l,count:0};
}
function nextPerspectiveQuestion(){
  if(!perspState.speaker||perspState.count>=3+Math.floor(Math.random()*2)) newPerspective();
  perspState.count++;
  const ids=Object.keys(PEOPLE);
  const preps=Array.from(trainFilter.preps);
  if(!preps.length) preps.push('l');
  let q=null;
  for(let attempt=0;attempt<30;attempt++){
    const target=ids[Math.floor(Math.random()*ids.length)];
    const role=roleFromPerspective(perspState.speaker,perspState.listener,target);
    if(!roleAllowed(role)) continue;
    const prep=preps[Math.floor(Math.random()*preps.length)];
    q={type:'prep',prep:prep,role:role,key:prep+':'+role,speaker:perspState.speaker,listener:perspState.listener,target:target};
    break;
  }
  if(!q){
    const target=ids[0];
    const role=roleFromPerspective(perspState.speaker,perspState.listener,target);
    const prep=preps[0];
    q={type:'prep',prep:prep,role:role,key:prep+':'+role,speaker:perspState.speaker,listener:perspState.listener,target:target};
  }
  return q;
}

function checkPerspective(showAnswer){

  const pool=prepPoolForms(q.prep,q.role);
  const res=showAnswer?{status:'wrong',reason:'',readings:[]}:checkTyped(pool,acc,val,null);
  if(res.status==='ambiguous'){showNikudNotice(res);return;}
  answered=true;
  const correct=res.status==='correct';

function speedOptions(q){
  const correct=FORMS[q.prep][q.role].u;
  const opts=[correct];
  const pool=[];
  PREP_DATA.forEach(function(p){ROLE_IDS.forEach(function(r){if(p.id===q.prep&&r===q.role)return;pool.push(FORMS[p.id][r].u);});});
  shuffle(pool);
  pool.forEach(function(u){if(opts.length<4&&!opts.some(function(o){return N(o)===N(u);}))opts.push(u);});
  return shuffle(opts);
}

function startSpeed(){

function makeKeyMiniQuestion(){
  const dirs=['end2role','role2end','pron2role','role2pron'];
  const dir=dirs[Math.floor(Math.random()*dirs.length)];
  if(dir==='pron2role'){
    const role=ROLE_IDS[Math.floor(Math.random()*ROLE_IDS.length)];
    const pron=PRON_BY_ROLE[role];
    const pn=N(pron.u);
    const correctRoles=ROLE_IDS.filter(function(r){return pronAccepted(r).map(N).indexOf(pn)>=0;});
    const opts=[];
    correctRoles.forEach(function(r){if(opts.length<4)opts.push(r);});
    const pool=ROLE_IDS.filter(function(r){return opts.indexOf(r)<0;});
    shuffle(pool);
    pool.forEach(function(r){if(opts.length<4)opts.push(r);});
    return {dir:dir,role:role,pron:pron,correctRoles:correctRoles,options:shuffle(opts)};
  }
  if(dir==='role2pron'){
    const role=ROLE_IDS[Math.floor(Math.random()*ROLE_IDS.length)];
    const correct=pronAccepted(role);
    const opts=correct.slice();
    const pool=ROLE_IDS.filter(function(r){return r!==role;}).map(function(r){return PRON_BY_ROLE[r].u;});
    shuffle(pool);
    pool.forEach(function(u){if(opts.length<4&&!opts.some(function(o){return N(o)===N(u);}))opts.push(u);});
    return {dir:dir,role:role,correct:correct,options:shuffle(opts)};
  }
  const role=ROLE_IDS[Math.floor(Math.random()*ROLE_IDS.length)];
  const endings=KEY_ENDINGS[role];
  const ending=endings[Math.floor(Math.random()*endings.length)];
  if(dir==='end2role'){
    const correctRoles=ROLE_IDS.filter(function(r){return KEY_ENDINGS[r].indexOf(ending)>=0;});
    const opts=[];
    correctRoles.forEach(function(r){if(opts.length<4)opts.push(r);});
    const pool=ROLE_IDS.filter(function(r){return opts.indexOf(r)<0;});
    shuffle(pool);
    pool.forEach(function(r){if(opts.length<4)opts.push(r);});
    return {dir:dir,role:role,ending:ending,correctRoles:correctRoles,options:shuffle(opts)};
  }
  const opts=endings.slice();
  const pool=Array.from(new Set([].concat.apply([],ROLE_IDS.map(function(r){return KEY_ENDINGS[r];})))).filter(function(e){return opts.indexOf(e)<0;});
  shuffle(pool);
  pool.forEach(function(e){if(opts.length<4)opts.push(e);});
  return {dir:dir,role:role,ending:ending,options:shuffle(opts)};
}

function renderListen(){

  answered=false;qStart=performance.now();
  const f=FORMS[q.prep][q.role];
  const matching=matchingRoles(q.prep,f.u);

  matching.forEach(function(r){if(opts.length<4)opts.push(r);});

      if(answered)return;
      answered=true;
      const clicked=btn.dataset.lrole;
      const correct=matching.indexOf(clicked)>=0;
      const elapsed=performance.now()-qStart;
      recordAnswer(q.key,correct,elapsed,clicked,'choice');
      if(!correct) noteWrong(q.key);
      document.getElementById('listen-options').querySelectorAll('[data-lrole]').forEach(function(b){

      if(phraseAnswered) return;
      const res=checkTyped(pool,acc,input.value,null);
      if(res.status==='ambiguous'){showNikudNotice(res);return;}
      phraseAnswered=true;

function phraseOptions(s){
  const correct=FORMS[s.prep][s.role].u;
  const opts=[correct];
  const otherPreps=PREP_DATA.filter(function(p){return p.id!==s.prep;});
  let guard=0;
  while(opts.length<4&&guard<60){
    guard++;
    let cand;
    if(opts.length===1){
      const p=otherPreps[Math.floor(Math.random()*otherPreps.length)];
      cand=FORMS[p.id][s.role].u;
    }else{
      const p=PREP_DATA[Math.floor(Math.random()*PREP_DATA.length)];
      const r=ROLE_IDS[Math.floor(Math.random()*ROLE_IDS.length)];
      cand=FORMS[p.id][r].u;
    }
    if(!opts.some(function(o){return N(o)===N(cand);})) opts.push(cand);
  }
  return shuffle(opts);
}
function finishPhrase(s,f,correct,given,reason){
  const elapsed=performance.now()-(s._start||performance.now());
  recordAnswer(s.prep+':'+s.role,correct,elapsed,given,currentPhraseMode==='choice'?'choice':'type');
  if(!correct) noteWrong(s.prep+':'+s.role);
  const blank=document.getElementById('phrase-blank');
  if(blank) blank.textContent=f.u;
  const res=document.getElementById('phrase-result');
  let html='<div class="result-box '+(correct?'ok':'bad')+'"><div class="result-title">'+(correct?'✅ '+t('correct'):'❌ '+t('wrong'))+'</div>';
  html+='<div class="result-he">'+heFormHTML(s.prep,s.role,true,'practice')+'</div>'+trDiv(f,'result-translit')+'<div class="result-gloss">'+glossOf(s.prep,s.role)+'</div>';
  if(!correct){
    html+='<div class="result-wrong-note">'+t('answerWas')+' '+heFormHTML(s.prep,s.role,true,'practice')+'</div>';
    if(given) html+='<div class="result-wrong-note">'+t('youTyped')+' <span class="he" lang="he" dir="rtl">'+escHtml(given)+'</span></div>';
    if(reason==='nikud') html+='<div class="colloq-note">'+t('nikudWrong')+'</div>';
    if(reason==='needNikud') html+='<div class="colloq-note">'+t('nikudNeed')+'</div>';
  }
  if(settings.register==='colloquial'&&(s.role==='2fp'||s.role==='3fp')){
    const sub=s.role==='2fp'?'2mp':'3mp';
    html+='<div class="colloq-note">'+t('colloqAlso')+' '+heFormHTML(s.prep,sub,true,'practice')+'</div>';
  }
  html+=speakBtn(f.u);
  html+='</div>';
  if(s.trap){
    const ids=trapForPrep(s.prep);
    const tr=TRAPS[ids[0]!==undefined?ids[0]:0];
    html+='<div class="trap-card"><div class="trap-title">'+t('phraseTrap')+'</div><div class="trap-text">'+(currentLang==='en'?tr.en:tr.ru)+'</div></div>';
  }
  if(res) res.innerHTML=html;
  const next=document.getElementById('phrase-next');
  if(next) next.style.display='inline-block';
  activeInput=null;
  syncKeyboard();
}

function exportProgress(){
  const data={version:1,stats:stats,settings:settings,best:bestTimes};
  try{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='hebrew_pronouns_progress.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    showToast(t('exported'));
  }catch(e){showToast(t('importError'));}
}
function importProgress(e){
  const file=e.target.files&&e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const data=JSON.parse(reader.result);
      if(data&&data.stats&&typeof data.stats==='object'){
        stats=data.stats;
        if(data.settings&&typeof data.settings==='object'){
          const base={nikud:'hint',translit:true,register:'colloquial',sound:true,strictPath:false,score:0,streak:0,bestStreak:0,endColors:true,nikudCheck:'auto',pfxFilter:{prefixes:[],tags:[],forms:[],weak:false,notAuto:false}};
          settings=Object.assign(base,data.settings);
          if(['always','hint','off'].indexOf(settings.nikud)<0) settings.nikud='hint';
          if(['colloquial','strict'].indexOf(settings.register)<0) settings.register='colloquial';
          if(typeof settings.endColors!=='boolean') settings.endColors=true;
          if(['auto','off','smart','full'].indexOf(settings.nikudCheck)<0) settings.nikudCheck='auto';
          if(!settings.pfxFilter||typeof settings.pfxFilter!=='object') settings.pfxFilter={prefixes:[],tags:[],forms:[],weak:false,notAuto:false};
          if(!Array.isArray(settings.pfxFilter.prefixes)) settings.pfxFilter.prefixes=[];
          if(!Array.isArray(settings.pfxFilter.tags)) settings.pfxFilter.tags=[];
          if(!Array.isArray(settings.pfxFilter.forms)) settings.pfxFilter.forms=[];
          if(typeof settings.pfxFilter.weak!=='boolean') settings.pfxFilter.weak=false;
          if(typeof settings.pfxFilter.notAuto!=='boolean') settings.pfxFilter.notAuto=false;
        }
        if(data.best&&typeof data.best==='object') bestTimes=data.best;
        saveStats();saveSettings();saveBest();updateProgress();applyEndColorsSetting();applyNikudCheckSetting();renderCurrent();closeModal();
        showToast(t('imported'));
      }else{
        showToast(t('importError'));
      }
    }catch(err){showToast(t('importError'));}
  };
  reader.readAsText(file);
}
function resetProgress(){

  stats={};

}

function pfxPick(pool){
  if(!pool||!pool.length) return null;
  let best=null;
  for(let attempt=0;attempt<6;attempt++){
    const cand=weightedPick(pool);
    const l1=pfxHistory[pfxHistory.length-1],l2=pfxHistory[pfxHistory.length-2];
    if(l1&&l2&&l1.prefix===cand.prefix&&l2.prefix===cand.prefix) continue;
    best=cand;break;
  }
  if(!best) best=weightedPick(pool);
  pfxHistory.push(best);
  if(pfxHistory.length>6) pfxHistory.shift();
  return best;
}

function pfxDecompParts(q){
  const parts=q.prefixes.slice();
  if(q.art) parts.push('ה');
  parts.push(q.word);
  return parts;
}
function pfxDecomp(q){
  const parts=pfxDecompParts(q);
  return {key:parts.join('|'),html:parts.map(function(x){return '<span class="he" lang="he" dir="rtl">'+x+'</span>';}).join(' + ')};
}
function pfxParseOptions(q){
  const correct=pfxDecomp(q);
  const opts=[correct];
  const prefixes=PREFIXES.map(function(p){return p.id;});
  function add(parts){
    const key=parts.join('|');
    if(opts.some(function(o){return o.key===key;})) return;
    opts.push({key:key,html:parts.map(function(x){return '<span class="he" lang="he" dir="rtl">'+x+'</span>';}).join(' + ')});
  }
  const base=pfxDecompParts(q);
  add(base.filter(function(x){return x!=='ה';}));
  const withArt=base.slice();
  if(withArt.indexOf('ה')<0) withArt.splice(withArt.length-1,0,'ה');
  add(withArt);
  const other=prefixes.filter(function(x){return x!==q.prefix;});
  shuffle(other);
  for(let i=0;i<other.length&&opts.length<4;i++){
    const parts=q.prefixes.slice();parts[0]=other[i];if(q.art)parts.push('ה');parts.push(q.word);add(parts);
  }
  return shuffle(opts);
}

    if(!pool.length) return null;

  const pool=pfxWordPool();

  if(!area) return;

    if(!pfxSpeedState) pfxSpeedState={running:false,correct:0};
    const best=bestTimes.pfxSpeed||0;
    let html='<div class="pfx-card"><div class="section-title">'+t('pfxModeSpeed')+'</div><div class="section-intro">'+t('pfxSpeedStart')+'</div>';

function findPfxItem(p){
  let it=PFX_ITEMS.find(function(x){return x.p===p;});
  if(it) return it;
  const n=N(p);
  return PFX_ITEMS.find(function(x){return N(x.p)===n;})||null;
}
function pfxPhraseOptions(s){

  const opts=[correct];
  const pool=PFX_ITEMS.map(function(it){return it.p;});
  shuffle(pool);
  pool.forEach(function(p){if(opts.length<4&&!opts.some(function(o){return N(o)===N(p);}))opts.push(p);});
  return shuffle(opts);
}

    if(pref){togglePfxFilter('prefixes',pref.dataset.pfxpref);return;}
    const tag=e.target.closest('[data-pfxtag]');
    if(tag){togglePfxFilter('tags',tag.dataset.pfxtag);return;}
    const form=e.target.closest('[data-pfxformfilter]');
    if(form){togglePfxFilter('forms',form.dataset.pfxformfilter);return;}
    const weak=e.target.closest('[data-pfxweak]');
    if(weak){settings.pfxFilter.weak=!settings.pfxFilter.weak;saveSettings();renderPfxFilters();pfxQ=null;renderPfxArea();return;}
    const na=e.target.closest('[data-pfxnotauto]');
    if(na){settings.pfxFilter.notAuto=!settings.pfxFilter.notAuto;saveSettings();renderPfxFilters();pfxQ=null;renderPfxArea();return;}
    const reset=e.target.closest('[data-pfxreset]');
    if(reset){settings.pfxFilter={prefixes:[],tags:[],forms:[],weak:false,notAuto:false};saveSettings();renderPfxFilters();pfxQ=null;renderPfxArea();return;}
    const mode=e.target.closest('[data-pfxmode]');
    if(mode){stopTimers();pfxMode=mode.dataset.pfxmode;pfxQ=null;pfxAnswered=false;pfxHintShown=false;pfxPhraseAnswered=false;pfxPhraseHintShown=false;pfxSpeedState=null;renderPfxModes();renderPfxArea();return;}
    const dir=e.target.closest('[data-pfxdir]');
    if(dir){pfxLetterDir=dir.dataset.pfxdir;pfxQ=null;renderPfxArea();return;}
    const pmode=e.target.closest('[data-pfxpmode]');
    if(pmode){pfxPhraseMode=pmode.dataset.pfxpmode;pfxPhraseAnswered=false;pfxPhraseHintShown=false;renderPfxArea();return;}
  });
  document.addEventListener('click',function(e){
    const sp=e.target.closest('[data-say]');
    if(sp){e.preventDefault();speakHebrew(sp.getAttribute('data-say'));}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      const ae=document.activeElement;
      if(ae&&ae.id==='phrase-input'){e.preventDefault();const btn=document.getElementById('phrase-check');if(btn)btn.click();}
    }
  });
}

let lastTouchEnd=0;
document.addEventListener('touchend',function(e){
  const now=Date.now();
  if(now-lastTouchEnd<=300) e.preventDefault();
  lastTouchEnd=now;
},{passive:false});

function init(){
  currentLang=loadLang();
  currentTheme=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
  settings=loadSettings();
  stats=loadStats();
  bestTimes=loadBest();
  keyboardOpen=loadKeyboard();
  initTrainFilter();
  applyTheme(currentTheme,false);
  buildKeyboard();
  buildNikudRow();
  bindEvents();
  applyEndColorsSetting();
  applyLanguage();
  applyNikudCheckSetting();
  updateProgress();
  renderCurrent();
  syncKeyboard();
}

init();
</script>
</body>
